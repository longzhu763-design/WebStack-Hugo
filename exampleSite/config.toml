baseURL               = "https://bestcrafttools.com/"
languageCode          = "en-us"
title                 = "Best Craft Tools"
theme                 = "WebStack-Hugo"
preserveTaxonomyNames = true
disablePathToLower    = true
hasCJKLanguage        = false
publishDir            = "public"				# 站点静态文件保存目录


[params]
    author        = "BestCraftTools"
    description   = "Curated list of the best AI tools for creators."
    upload        = "#"      # 左侧导航栏的"网站提交"，暂时设为空
    about         = "#"      # 左侧导航栏的"关于导航"页面
    repository    = "https://github.com/longzhu763-design/WebStack-Hugo"  
    enablePreLoad = false					# 【已关闭】网站完全打开前预加载动画
    textPreLoad   = ""		                # 预加载文字已清空
    expandSidebar = false					# 默认展开左侧边导航栏
    logosPath     = "assets/images/logos"			# 网站每个导航地址logo存放地址
    defaultLogo   = "assets/images/logos/default.webp"		# logo图片资源不存在或者错误时, 默认显示的logo
    nightMode     = true					# 默认站点为深色(夜间)模式
    yiyan         = false                   # 已关闭一言服务
    fancybox      = true                    # 使用 Fancybox 实现图片灯箱/放大功能

[params.seo]    
    # 删除了百度统计和 51.LA，为了出海站的速度与纯净
    GoogleAdsClient = ''					# Google AdSense 你的广告代码填这里

# 删除了 [params.qweather] 天气插件配置，因为海外站不需要国内天气

[params.images]
    favicon           = "assets/images/bi-favicon.png"
    searchImageL      = "assets/images/bg-dna.jpg"		# 搜索部分浅色背景图
    searchImageD      = "assets/images/bg-dna.jpg"		# 搜索部分深色背景图
    logoExpandLight   = "assets/images/bi-expand-dark.png"
    logoExpandDark    = "assets/images/bi-expand-light.png"
    logoCollapseLight = "assets/images/bi.png"
    logoCollapseDark  = "assets/images/bi.png"
    
[markup.goldmark.renderer]
    unsafe = true

[params.footer]
    copyright = '&copy; 2026 BestCraftTools. All rights reserved.<br/>'
