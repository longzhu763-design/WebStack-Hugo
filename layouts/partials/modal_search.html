<div class="modal fade search-modal" id="search-modal">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body">
                <div id="search" class="s-search mx-auto my-4">
                    <!-- 精简后的搜索引擎切换 -->
                    <div id="search-list" class="hide-type-list">
                        <div class="search-group group-a">
                            <ul class="search-type">
                                <li><input checked="checked" hidden="" type="radio" name="type2" 
                                    id="m_type-google" value="https://www.google.com/search?q=" data-placeholder="Search Google...">
                                    <label for="m_type-google"><span class="text-muted">Google</span></label></li>
                                <li><input hidden="" type="radio" name="type2"
                                    id="m_type-bing" value="https://www.bing.com/search?q=" data-placeholder="Search Bing...">
                                    <label for="m_type-bing"><span class="text-muted">Bing</span></label></li>
                                <li><input hidden="" type="radio" name="type2" 
                                    id="m_type-duckduckgo" value="https://duckduckgo.com/?q=" data-placeholder="Search DuckDuckGo...">
                                    <label for="m_type-duckduckgo"><span class="text-muted">DuckDuckGo</span></label></li>
                            </ul>
                        </div>
                    </div>

                    <!-- 核心搜索表单：默认提交到谷歌 -->
                    <form action="https://www.google.com/search" method="get" target="_blank" class="super-search-fm">
                        <input type="text" id="m_search-text" name="q" class="form-control smart-tips search-key" zhannei=""
                                autocomplete="off" placeholder="Search AI tools..." style="outline:0">
                        <button type="submit"><i class="iconfont icon-search"></i></button>
                    </form>
                    
                    <div class="card search-smart-tips" style="display: none">
                        <ul></ul>
                    </div>
                </div>
            </div>
            
            <!-- 弹窗底部的关闭按钮 -->
            <div style="position: absolute;bottom: -40px;width: 100%;text-align: center;">
                <a href="javascript:" data-dismiss="modal"><i class="iconfont icon-close-circle icon-2x" style="color: #fff;"></i></a>
            </div>
        </div>
    </div>
</div>
